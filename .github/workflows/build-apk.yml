name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          unzip -q ScreenTranslate_V2_manga_source.zip -d source

      - name: Fix missing import
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "source/ScreenTranslate/app/src/main/java/"
              "com/example/screentranslate/CaptureService.kt"
          )
          content = path.read_text(encoding="utf-8")
          required_import = "import com.google.mlkit.common.model.DownloadConditions"

          if required_import not in content:
              content = content.replace(
                  "import com.google.mlkit.nl.languageid.LanguageIdentification",
                  required_import + "\n"
                  + "import com.google.mlkit.nl.languageid.LanguageIdentification",
              )
              path.write_text(content, encoding="utf-8")
          PY

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          gradle -p source/ScreenTranslate :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslate-APK
          path: source/ScreenTranslate/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
